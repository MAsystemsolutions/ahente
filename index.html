<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ahente Portal</title>
<meta name="theme-color" content="#e8f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ahente">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#e8f6f2;--bg2:#f4fbf9;--navy:#2c3e6b;--navy2:#4d6699;--teal:#2bb5a0;--teal2:#d9f5ee;--tealD:#1d8a7a;--pink:#d94c6e;--pink2:#ffe4ec;--gold:#ffd66b;--gold2:#fff6d9;--red:#e0475f;--red2:#ffe1e6;--muted:#7a8aa6;--line:#d6ece6;--white:#fff;
--r:20px;--shadow:0 2px 0 rgba(44,62,107,.06),0 6px 18px rgba(44,62,107,.08);--font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);font-size:16px;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus{outline:none}button:focus-visible{outline:3px solid var(--teal2)}
input,select,textarea{font:inherit;color:var(--navy)}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:800}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:calc(160px + var(--safeb))}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,rgba(232,246,242,0));padding:calc(10px + var(--safet)) 14px 8px;display:flex;align-items:center;gap:10px}
.top img{width:40px;height:40px;border-radius:12px}
.brand{font-weight:900;font-size:19px;line-height:1.05}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:800}
.tb{flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--white);display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow);position:relative;flex:none}
.belln{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;border-radius:99px;font-size:11px;font-weight:900;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.view{padding:2px 14px 14px;animation:fade .12s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
h2{font-size:21px;margin:8px 2px 12px;font-weight:900}h3{font-size:15px;margin:16px 2px 8px;font-weight:900}
.card{background:var(--white);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hello{display:flex;align-items:flex-end;gap:8px;margin:0 0 12px}.hello img{width:64px}
.bubble{background:var(--white);border-radius:18px 18px 18px 6px;padding:11px 14px;box-shadow:var(--shadow);font-weight:800;font-size:15px;line-height:1.35}
.bubble small{display:block;font-weight:700;color:var(--muted);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:var(--r);padding:13px;box-shadow:var(--shadow);background:var(--white);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.stat .lbl{font-weight:900;font-size:13px}.stat .amt{font-weight:900;font-size:24px;margin-top:4px}.stat .sub{font-size:12px;font-weight:700;color:var(--muted)}
.stat.big{grid-column:1/-1;background:var(--navy);color:#fff}.stat.big .sub{color:#cfd9ee}
.stat.t{background:var(--teal2)}.stat.g{background:var(--gold2)}.stat.p{background:var(--pink2)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--gold2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.alert.red{background:var(--red2)}.alert .e{font-size:22px}.alert .t1{font-weight:900}.alert .t2{font-size:13px;font-weight:700;color:var(--navy2);margin-top:2px}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{background:var(--white);border-radius:12px;padding:8px 11px;font-weight:900;font-size:13px;box-shadow:var(--shadow)}
.mini.teal{background:var(--teal);color:#fff}.mini.pink{background:var(--pink);color:#fff}.mini.navy{background:var(--navy);color:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--white);font-weight:800;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.item{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--bg2)}
.item .mid{flex:1;min-width:0}.item .t1{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:900;white-space:nowrap;text-align:right}
.tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.tag.trial{background:var(--gold2);color:#a86b00}.tag.active{background:var(--teal2);color:var(--tealD)}.tag.expired{background:var(--red2);color:var(--red)}.tag.paused{background:#eee;color:#666}.tag.soon{background:var(--pink);color:#fff}
.tag.kw{background:#dcecfb;color:#2c5c9e}.tag.pc{background:var(--pink2);color:#b83a5a}.tag.bundle{background:#ece4ff;color:#5a3fb0}
.search{width:100%;padding:13px 15px;border-radius:16px;border:2px solid var(--line);background:var(--white);margin-bottom:10px;outline:0}
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:900;font-size:17px;text-align:center;box-shadow:var(--shadow)}
.btn.main{background:var(--navy);color:#fff}.btn.teal{background:var(--teal);color:#fff}.btn.pink{background:var(--pink);color:#fff}.btn.soft{background:var(--white)}.btn.danger{background:var(--white);color:var(--red)}
.btn[disabled]{opacity:.5}
.btn:active,.chip:active,.mini:active,.iconbtn:active{transform:scale(.97)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.field{margin-bottom:11px}.field label{display:block;font-weight:900;font-size:13px;margin:0 4px 5px;color:var(--navy2)}.field label small{font-weight:700;color:var(--muted)}
.inp{width:100%;padding:13px 14px;border-radius:15px;border:2px solid var(--line);background:var(--white);outline:0;font-weight:700}
.inp:focus{border-color:var(--teal)}
.opts{display:grid;gap:8px}
.opt{background:var(--white);border-radius:18px;padding:13px 15px;font-weight:900;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);border:3px solid transparent;width:100%}
.opt .e{font-size:24px}.opt small{display:block;font-size:12px;color:var(--muted);font-weight:700}.opt .pr{margin-left:auto;color:var(--tealD);white-space:nowrap}
.opt.sel{border-color:var(--teal);background:var(--bg2)}
.seg{display:flex;background:var(--white);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;border-radius:13px;font-weight:900;font-size:15px}.seg button.on{background:var(--navy);color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(44,62,107,.42);z-index:60;opacity:0;transition:opacity .15s}.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:620px;background:var(--bg2);border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(18px + var(--safeb));transform:translateY(100%);transition:transform .18s ease-out}
.sheet.show{transform:none}.grab{width:44px;height:5px;border-radius:9px;background:#c8e2db;margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sheet-head h2{margin:0}
.x{width:40px;height:40px;border-radius:14px;background:var(--white);font-size:20px;font-weight:900;box-shadow:var(--shadow);flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-weight:800;font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted);font-weight:700}.kv span:last-child{text-align:right;word-break:break-all}
.msgbox{background:var(--white);border:2px dashed var(--teal);border-radius:16px;padding:12px;font-size:14px;font-weight:700;line-height:1.45;white-space:pre-wrap;margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:620px;background:var(--white);border-radius:24px 24px 0 0;box-shadow:0 -6px 22px rgba(44,62,107,.1);display:flex;justify-content:space-around;padding:7px 6px calc(7px + var(--safeb))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.nav button .e{font-size:22px;filter:grayscale(.6);opacity:.7}.nav button.on{color:var(--navy)}.nav button.on .e{filter:none;opacity:1}
.fab{position:fixed;right:max(16px,calc(50vw - 294px));bottom:calc(84px + var(--safeb));z-index:31;background:var(--teal);color:#fff;font-weight:900;border-radius:20px;padding:15px 18px;box-shadow:0 8px 18px rgba(43,181,160,.45)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safeb));transform:translateX(-50%) translateY(16px);z-index:120;background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;opacity:0;transition:all .18s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.screen{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(20px + var(--safet)) 18px calc(18px + var(--safeb))}
.screen .inner{width:100%;max-width:440px}
.loading{text-align:center;padding:40px 10px;color:var(--muted);font-weight:800}
.spin{width:34px;height:34px;border:4px solid var(--teal2);border-top-color:var(--teal);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    '<div class="kv"><span>Referral code</span><span>' + st.sid + '</span></div>' + (st.referredBy ? '<div class="kv"><span>Ni-refer ng</span><span>' + esc(st.referredBy) + '</span></div>' : '') +
    (Number(st.credit) > 0 ? '<div class="kv"><span>Referral credit</span><span>' + peso(st.credit) + '</span></div>' : '') +
    (isAdmin() ? '<div class="kv"><span>Ahente</span><span>' + esc(agentName(st.agentId)) + '</span></div>' : '') +
    '<div class="kv"><span>Huling gamit</span><span>' + pd(s.lastSeen) + '</span></div><div class="kv"><span>Ginawa</span><span>' + pd(st.createdAt) + '</span></div></div>' +
    '<div class="row2" style="margin-bottom:10px"><button class="btn soft" style="font-size:15px" id="s-inv">💌 Link + mensahe</button><button class="btn soft" style="font-size:15px" id="s-ren">📋 Paalala sa renew</button></div>' +
    (isAdmin() ? '<button class="btn teal" id="s-pay" style="margin-bottom:10px">💵 I-record ang bayad</button><div class="row2"><button class="btn soft" style="font-size:15px" id="s-agent">🤝 Palitan ang ahente</button><button class="btn ' + (s.reason === 'paused' ? 'teal' : 'danger') + '" style="font-size:15px" id="s-pause">' + (s.reason === 'paused' ? '▶️ Ituloy' : '⏸ I-pause') + '</button></div>'
      : (req ? '<div class="card small b" style="background:var(--teal2)">⏳ Naghihintay ng kumpirmasyon ng admin (' + req.months + ' buwan).</div>' : '<button class="btn teal" id="s-req">✅ Nagbayad na ang customer</button>')));
  el.querySelector('#s-inv').onclick = () => msgSheet(inviteMsg(st), '💌 Para sa customer');
  el.querySelector('#s-ren').onclick = () => msgSheet(renewMsg(st), '📋 Paalala sa renew');
  const pay = el.querySelector('#s-pay'); if (pay) pay.onclick = () => paySheet(sid);
  const rq = el.querySelector('#s-req'); if (rq) rq.onclick = () => reqSheet(sid);
  const ag = el.querySelector('#s-agent'); if (ag) ag.onclick = () => assignSheet(sid);
  const pa = el.querySelector('#s-pause'); if (pa) pa.onclick = async () => {
    const p = s.reason !== 'paused'; if (!await confirmSheet(p ? '⏸ I-pause?' : '▶️ Ituloy?', p ? 'Hindi muna magagamit ng tindahan ang app. Ligtas ang data nila.' : 'Magagamit ulit ng tindahan ang app.')) return;
    try { toast('Sandali…'); await api('pauseStore', { sid, paused: p }); toast('Ayos!'); load(true); } catch (e) { toast(e.message); }
  };
}
function paySheet(sid, months0) {
  const st = D().stores.find(x => x.sid === sid); if (!st) return;
  let months = Number(months0) || 1, method = 'GCash';
  const el = openSheet('<div class="sheet-head"><h2>💵 Bayad: ' + esc(st.name) + '</h2><button class="x" data-x>×</button></div>' +
    '<div class="seg" id="p-m">' + [1, 3, 6, 12].map(m => '<button data-m="' + m + '">' + (m === 12 ? '1 taon' : m + ' buwan') + '</button>').join('') + '</div>' +
    '<div class="seg" id="p-w">' + ['GCash', 'Cash', 'Bank'].map(m => '<button data-w="' + m + '">' + m + '</button>').join('') + '</div>' +
    '<div class="card" id="p-q"></div><div class="field"><label>Tala <small>(opsyonal, hal. GCash ref)</small></label><input class="inp" id="p-note"></div>' +
    '<button class="btn teal" id="p-ok">✅ I-record at i-renew</button>');
  const paint = () => {
    el.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === months));
    el.querySelectorAll('[data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === method));
    const q = quote(st, months);
    el.querySelector('#p-q').innerHTML = '<div class="kv"><span>Presyo</span><span>' + peso(q.gross) + '</span></div>' + (q.refDiscount ? '<div class="kv"><span>🎁 Referral (unang bayad)</span><span>−' + peso(q.refDiscount) + '</span></div>' : '') +
      (q.creditUsed ? '<div class="kv"><span>🎁 Referral credit</span><span>−' + peso(q.creditUsed) + '</span></div>' : '') +
      '<div class="kv" style="font-size:18px"><span style="color:var(--navy);font-weight:900">Babayaran</span><span>' + peso(q.net) + '</span></div>' +
      (st.agentId ? '<div class="kv"><span>Para kay ' + esc(agentName(st.agentId)) + ' (' + D().settings.commission + '%)</span><span>' + peso(q.agentShare) + '</span></div><div class="kv"><span>Para sa iyo</span><span>' + peso(q.net - q.agentShare) + '</span></div>' : '');
  };
  el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { months = +b.dataset.m; paint(); });
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { method = b.dataset.w; paint(); });
  el.querySelector('#p-ok').onclick = async e => {
    const b = e.target; b.disabled = true; b.textContent = 'Sandali…';
    try { const j = await api('recordPayment', { sid, months, method, note: el.querySelector('#p-note').value }); closeSheet(); toast('✅ Na-renew! Bayad na hanggang ' + pd(j.until)); load(true); }
    catch (err) { toast(err.message); b.disabled = false; b.textContent = '✅ I-record at i-renew'; }
  };
  paint();
}
function reqSheet(sid) {
  const st = D().stores.find(x => x.sid === sid); let months = 1;
  const el = openSheet('<div class="sheet-head"><h2>✅ Nagbayad na</h2><button class="x" data-x>×</button></div><div class="card small b">Sasabihan ang admin na nagbayad na ang <b>' + esc(st.name) + '</b>. Kapag na-confirm, kusang mare-renew ang tindahan at papasok ang kita mo.</div>' +
    '<div class="seg">' + [1, 12].map(m => '<button data-m="' + m + '" class="' + (m === 1 ? 'on' : '') + '">' + (m === 12 ? '1 taon · ' + peso(priceOf(st.plan, 12)) : '1 buwan · ' + peso(priceOf(st.plan, 1))) + '</button>').join('') + '</div>' +
    '<div class="field"><label>Tala <small>(hal. GCash ref no., oras ng bayad)</small></label><input class="inp" id="r-note"></div><button class="btn teal" id="r-ok">Ipadala sa admin</button>');
  el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { months = +b.dataset.m; el.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); });
  el.querySelector('#r-ok').onclick = async e => { e.target.disabled = true; try { await api('requestRenew', { sid, months, note: el.querySelector('#r-note').value }); closeSheet(); toast('Naipadala! Hintayin ang kumpirmasyon ng admin. 🙌'); load(true); } catch (err) { toast(err.message); e.target.disabled = false; } };
}
function assignSheet(sid) {
  const st = D().stores.find(x => x.sid === sid);
  const el = openSheet('<div class="sheet-head"><h2>🤝 Ahente ng ' + esc(st.name) + '</h2><button class="x" data-x>×</button></div><div class="opts">' +
    [{ id: '', name: 'Walang ahente (direkta sa akin)' }].concat(D().agents || []).map(a => '<button class="opt ' + ((st.agentId || '') === a.id ? 'sel' : '') + '" data-a="' + a.id + '"><span class="e">' + (a.id ? '🤝' : '👑') + '</span><span>' + esc(a.name) + (a.id ? '<small>' + a.id + '</small>' : '') + '</span></button>').join('') + '</div>');
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { try { await api('updateStore', { sid, agentId: b.dataset.a }); closeSheet(); toast('Na-save!'); load(true); } catch (e) { toast(e.message); } });
}
function newStoreSheet() {
  let plan = 'bundle';
  const el = openSheet('<div class="sheet-head"><h2>＋ Bagong tindahan</h2><button class="x" data-x>×</button></div>' +
    '<div class="field"><label>Pangalan ng tindahan</label><input class="inp" id="n-name" placeholder="hal. Aling Nena Sari-Sari Store"></div>' +
    '<div class="row2"><div class="field"><label>May-ari <small>(opsyonal)</small></label><input class="inp" id="n-owner"></div><div class="field"><label>Contact <small>(opsyonal)</small></label><input class="inp" id="n-contact" placeholder="09XX / FB"></div></div>' +
    '<div class="field"><label>Anong app?</label><div class="opts" id="n-plan">' + ['bundle', 'kw', 'pc'].map(p => '<button class="opt" data-p="' + p + '"><span class="e">' + PLAN[p][0] + '</span><span>' + PLAN[p][1] + '<small>' + (p === 'bundle' ? 'Bookkeeping + POS/Inventory · pinakasulit' : p === 'kw' ? 'Bookkeeping: kita, gastos, utang' : 'POS + Inventory: scan, benta, stock') + '</small></span><span class="pr">' + peso(priceOf(p, 1)) + '/buwan</span></button>').join('') + '</div></div>' +
    '<div class="field"><label>Referral code <small>(kung may nag-refer na customer, opsyonal)</small></label><input class="inp" id="n-ref" placeholder="R-XXXXX" autocapitalize="characters"></div>' +
    (isAdmin() ? '<div class="field"><label>Ahente</label><select class="inp" id="n-agent"><option value="">Walang ahente (direkta)</option>' + (D().agents || []).map(a => '<option value="' + a.id + '">' + esc(a.name) + '</option>').join('') + '</select></div>' : '') +
    '<button class="btn teal" id="n-ok">Gumawa ng link 🚀</button>');
  const paint = () => el.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('sel', b.dataset.p === plan));
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { plan = b.dataset.p; paint(); }); paint();
  setTimeout(() => el.querySelector('#n-name').focus(), 250);
  el.querySelector('#n-ok').onclick = async e => {
    const b = e.target, name = el.querySelector('#n-name').value.trim(); if (!name) { toast('Ilagay ang pangalan ng tindahan'); return; }
    b.disabled = true; b.textContent = 'Ginagawa… (ilang segundo)';
    try {
      const j = await api('createStore', { name, owner: el.querySelector('#n-owner').value, contact: el.querySelector('#n-contact').value, plan, referredBy: el.querySelector('#n-ref').value, agentId: isAdmin() ? el.querySelector('#n-agent').value : '' });
      S.data.stores.push(Object.assign({ st: { state: 'trial', daysLeft: D().settings.trialDays, until: '' }, paidCount: 0 }, j.store));
      msgSheet(inviteMsg(j.store), '🎉 Handa na ang link!'); load(true);
    } catch (err) { toast(err.message); b.disabled = false; b.textContent = 'Gumawa ng link 🚀'; }
  };
}
/* ---------- sheets: agents ---------- */
function agentSheet(id) {
  const a = D().agents.find(x => x.id === id), e = earned(id), po = paidOut(id), n = (D().stores || []).filter(x => x.agentId === id).length;
  const el = openSheet('<div class="sheet-head"><h2>🤝 ' + esc(a.name) + '</h2><button class="x" data-x>×</button></div><div class="card"><div class="kv"><span>Agent ID</span><span>' + a.id + '</span></div><div class="kv"><span>Contact</span><span>' + esc(a.contact || '—') + '</span></div><div class="kv"><span>GCash</span><span>' + esc(a.gcash || '—') + '</span></div><div class="kv"><span>Tindahan</span><span>' + n + '</span></div><div class="kv"><span>Lahat ng kita</span><span>' + peso(e) + '</span></div><div class="kv"><span>Nabayaran na</span><span>' + peso(po) + '</span></div><div class="kv" style="font-size:17px"><span>Balanse</span><span>' + peso(e - po) + '</span></div></div>' +
    '<button class="btn teal" id="a-pay" style="margin-bottom:10px">💰 Nabayaran ko na</button><div class="row2" style="margin-bottom:10px"><button class="btn soft" style="font-size:15px" id="a-edit">✏️ I-edit</button><button class="btn soft" style="font-size:15px" id="a-pin">🔑 Bagong PIN</button></div>' +
    '<div class="row2"><button class="btn soft" style="font-size:15px" id="a-stores">🏪 Mga tindahan</button><button class="btn ' + (a.status === 'paused' ? 'teal' : 'danger') + '" style="font-size:15px" id="a-st">' + (a.status === 'paused' ? '▶️ I-activate' : '⏸ I-pause') + '</button></div>');
  el.querySelector('#a-pay').onclick = () => payoutSheet(id);
  el.querySelector('#a-stores').onclick = () => { closeSheet(); S.agentF = id; S.filter = 'all'; go('stores'); };
  el.querySelector('#a-pin').onclick = async () => { if (!await confirmSheet('🔑 Bagong PIN?', 'Hindi na gagana ang lumang PIN ni ' + esc(a.name) + '.')) return; try { const j = await api('resetAgentPin', { agentId: id }); msgSheet(agentWelcome(a.id, a.name, j.pin), '🔑 Bagong PIN'); } catch (e) { toast(e.message); } };
  el.querySelector('#a-st').onclick = async () => { const p = a.status !== 'paused'; if (!await confirmSheet(p ? '⏸ I-pause ang ahente?' : '▶️ I-activate?', p ? 'Hindi na siya makakapag-login. Mananatili ang mga tindahan niya.' : 'Makakapag-login ulit siya.')) return; try { await api('updateAgent', { agentId: id, status: p ? 'paused' : 'active' }); toast('Ayos!'); load(true); } catch (e) { toast(e.message); } };
  el.querySelector('#a-edit').onclick = () => agentForm(a);
}
function agentWelcome(id, name, pin) {
  return 'Hi ' + name + '! 🤝 Welcome sa team ng ' + (D().settings.bizName || 'MA System Solutions') + '!\n\nIto ang Ahente Portal mo:\n' + PORTAL_URL + '\n\nAgent ID: ' + id + '\nPIN: ' + pin +
    '\n\nI-install mo sa phone (Chrome: ⋮ → Install app, iPhone Safari: Share → Add to Home Screen), tapos palitan agad ang PIN sa tab na "Ako". 💗';
}
function agentForm(a) {
  a = a || {};
  const el = openSheet('<div class="sheet-head"><h2>' + (a.id ? '✏️ I-edit' : '＋ Bagong ahente') + '</h2><button class="x" data-x>×</button></div>' +
    '<div class="field"><label>Pangalan</label><input class="inp" id="g-name" value="' + esc(a.name || '') + '"></div><div class="field"><label>Contact <small>(phone / FB)</small></label><input class="inp" id="g-contact" value="' + esc(a.contact || '') + '"></div>' +
    '<div class="field"><label>GCash number <small>(dito mo ipapadala ang hati niya)</small></label><input class="inp" id="g-gcash" inputmode="tel" value="' + esc(a.gcash || '') + '"></div><button class="btn teal" id="g-ok">' + (a.id ? 'I-save' : 'Gumawa ng account') + '</button>');
  el.querySelector('#g-ok').onclick = async e => {
    const name = el.querySelector('#g-name').value.trim(); if (!name) { toast('Ilagay ang pangalan'); return; }
    e.target.disabled = true; const body = { name, contact: el.querySelector('#g-contact').value, gcash: el.querySelector('#g-gcash').value };
    try {
      if (a.id) { await api('updateAgent', Object.assign({ agentId: a.id }, body)); closeSheet(); toast('Na-save!'); }
      else { const j = await api('addAgent', body); msgSheet(agentWelcome(j.agentId, name, j.pin), '🎉 Ipadala ito sa ahente'); }
      load(true);
    } catch (err) { toast(err.message); e.target.disabled = false; }
  };
}
function payoutSheet(id) {
  const a = D().agents.find(x => x.id === id), bal = Math.max(0, earned(id) - paidOut(id));
  const el = openSheet('<div class="sheet-head"><h2>💰 Bayad kay ' + esc(a.name) + '</h2><button class="x" data-x>×</button></div>' + (a.gcash ? '<div class="card b">GCash: ' + esc(a.gcash) + '</div>' : '') +
    '<div class="field"><label>Halagang ipinadala</label><input class="inp" id="o-amt" inputmode="decimal" value="' + (Math.round(bal * 100) / 100) + '"></div><div class="field"><label>Tala <small>(hal. GCash ref)</small></label><input class="inp" id="o-note"></div><button class="btn teal" id="o-ok">✅ I-record</button>');
  el.querySelector('#o-ok').onclick = async e => { e.target.disabled = true; try { await api('payout', { agentId: id, amount: el.querySelector('#o-amt').value, note: el.querySelector('#o-note').value }); closeSheet(); toast('Na-record! 💸'); load(true); } catch (err) { toast(err.message); e.target.disabled = false; } };
}
function importSheet() {
  const el = openSheet('<div class="sheet-head"><h2>📥 Lumang tindahan</h2><button class="x" data-x>×</button></div><div class="card small b" style="line-height:1.5">Para sa mga tindahang ginawa mo sa lumang admin page. I-paste ang link nila (o ang code).</div>' +
    '<div class="field"><label>🐃 Kwentoink link <small>(kung meron)</small></label><input class="inp" id="i-kw"></div><div class="field"><label>🐱 Puscart link <small>(kung meron)</small></label><input class="inp" id="i-pc"></div>' +
    '<div class="field"><label>Ahente</label><select class="inp" id="i-ag"><option value="">Walang ahente (direkta)</option>' + (D().agents || []).map(a => '<option value="' + a.id + '">' + esc(a.name) + '</option>').join('') + '</select></div><button class="btn teal" id="i-ok">Idagdag</button>');
  el.querySelector('#i-ok').onclick = async e => { e.target.disabled = true; try { await api('importStore', { kwCode: el.querySelector('#i-kw').value, pcCode: el.querySelector('#i-pc').value, agentId: el.querySelector('#i-ag').value }); closeSheet(); toast('Naidagdag!'); load(true); } catch (err) { toast(err.message); e.target.disabled = false; } };
}
function changePinSheet() {
  const el = openSheet('<div class="sheet-head"><h2>🔑 Palitan ang PIN</h2><button class="x" data-x>×</button></div><div class="field"><label>Lumang PIN</label><input class="inp" id="c-old" type="password" inputmode="numeric"></div><div class="field"><label>Bagong PIN <small>(4–6 numero)</small></label><input class="inp" id="c-new" type="password" inputmode="numeric"></div><button class="btn teal" id="c-ok">I-save</button>');
  el.querySelector('#c-ok').onclick = async e => { e.target.disabled = true; try { const j = await api('changePin', { oldPin: el.querySelector('#c-old').value, newPin: el.querySelector('#c-new').value }); S.token = j.token; LS.set('token', j.token); closeSheet(); toast('Napalitan na ang PIN! 🔑'); } catch (err) { toast(err.message); e.target.disabled = false; } };
}

/* ---------- actions ---------- */
const ACT = {
  store: sid => storeSheet(sid), filter: f => { S.filter = f; render(); },
  renewMsg: sid => msgSheet(renewMsg(D().stores.find(x => x.sid === sid)), '📋 Paalala sa renew'),
  reqRenew: sid => reqSheet(sid), pay: arg => { const [sid, m] = String(arg).split('|'); paySheet(sid, m); },
  resolve: async id => { try { await api('resolveRequest', { id }); toast('Tinanggal'); load(true); } catch (e) { toast(e.message); } },
  payout: id => payoutSheet(id), agent: id => agentSheet(id), addAgent: () => agentForm(),
  saveSettings: async () => { const s = {}; $$('[data-s]').forEach(i => s[i.dataset.s] = i.value); try { const j = await api('saveSettings', { settings: s }); S.data.settings = j.settings; toast('Na-save ang settings! 💾'); } catch (e) { toast(e.message); } },
  import: () => importSheet(), changePin: () => changePinSheet(), logout: () => logout()
};
$('#fab').onclick = () => newStoreSheet();
$('#btn-refresh').onclick = () => load(true);
$('#btn-bell').onclick = () => { go('home'); setTimeout(() => { const h = Array.from(document.querySelectorAll('#view h3'))[0]; if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) load(false); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
if (API_URL.indexOf('PASTE_') === 0) { document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif">Ilagay muna ang API_URL sa index.html.</div>'; }
else if (S.token) start(); else loginScreen();
</script>
</body>
</html>
